# Mock of the freespoke.com endpoints the search widget touches. Every response
# allows the requesting origin, which is what a real widget row with the test
# site in allowed_domains would do.
map $http_origin $cors_origin {
    default "*";
    "~^https?://" $http_origin;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;

    # Widget bundle and manifest built by `pnpm run build:widget` in app/web.
    location /widgets/ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Author pictures the dev mu-plugin hands to get_avatar_url.
    location /avatars/ {
        try_files $uri =404;
    }

    # GET /api/widget/theme/<clientId>?theme=light|dark
    location ~ ^/api/widget/theme/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Cache-Control "no-store" always;
        if ($arg_theme = "dark") {
            rewrite ^ /api-data/theme-dark.json break;
        }
        rewrite ^ /api-data/theme-light.json break;
    }

    # GET /api/widget/search?q=...&clientId=...
    location = /api/widget/search {
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Cache-Control "no-store" always;
        rewrite ^ /api-data/search.json break;
    }

    location /api-data/ {
        internal;
    }
}
