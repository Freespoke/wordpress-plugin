# Local WordPress for exercising the Freespoke Search plugin against a locally
# built widget bundle. See README.md in this directory.
#
#   docker compose up -d
#   ./seed.sh
#   open http://localhost:8080/search/?q=elizabeth+mitchell
name: freespoke-wp-dev

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Where the browser loads the widget bundle and its APIs from. Defaults to
      # the mock-api service below; point it at a real environment to test
      # against live search.
      FREESPOKE_BASE_URL: ${FREESPOKE_BASE_URL:-http://localhost:8890}
      # Set to a post type name (e.g. post-author) to imitate a site whose
      # authors are posts rather than user profiles. See README.md.
      FREESPOKE_AUTHOR_POST_TYPE: ${FREESPOKE_AUTHOR_POST_TYPE:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      # The plugin source, with its dev vendor/ tree, mounted where WordPress
      # keeps plugins. It stays INACTIVE; the mu-plugin below boots it with a
      # dev base URL instead of the __BASE_URL__ placeholder build.sh stamps.
      - ..:/var/www/html/wp-content/plugins/freespoke-search:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      # composer install links vendor/freespoke/partner to ../../../php, the
      # sibling partner client; mount it where that link resolves in here.
      - ../../php:/var/www/html/wp-content/plugins/php:ro

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      FREESPOKE_BASE_URL: ${FREESPOKE_BASE_URL:-http://localhost:8890}
      FREESPOKE_AUTHOR_POST_TYPE: ${FREESPOKE_AUTHOR_POST_TYPE:-}
    volumes:
      - wp_data:/var/www/html
      - ..:/var/www/html/wp-content/plugins/freespoke-search:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ../../php:/var/www/html/wp-content/plugins/php:ro

  # Stands in for freespoke.com: serves the widget bundle built from this
  # checkout (pnpm run build:widget in app/web) plus canned theme and search
  # responses, so the page renders end to end without the Freespoke stack.
  mock-api:
    image: nginx:1.27-alpine
    ports:
      - "8890:80"
    volumes:
      - ./mock-api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mock-api/data:/usr/share/nginx/html/api-data:ro
      - ./avatars:/usr/share/nginx/html/avatars:ro
      - ../../../../web/public/widgets:/usr/share/nginx/html/widgets:ro

volumes:
  db_data:
  wp_data:
